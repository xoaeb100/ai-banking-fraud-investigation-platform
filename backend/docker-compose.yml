services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: fraud-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud_platform
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fraud-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: fraud-platform-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: shoaib@fraud-investigation.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
  ml-service:
    build:
      context: ../ml-service
    container_name: fraud-platform-ml
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build:
      context: .
    container_name: fraud-platform-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: fraud_platform
      DATABASE_USER: fraud_user
      DATABASE_PASSWORD: fraud_password

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ML_SERVICE_URL: http://ml-service:8000

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - postgres
      - redis
      - ml-service

volumes:
  postgres_data:
  redis_data: